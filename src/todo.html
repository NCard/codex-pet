<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wiki Wiki 待辦事項</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body>
  <div class="header">
    <h1>📋 待辦事項小秘書</h1>
    <p>記下該做的事，還能串聯提醒喔！</p>
  </div>
  
  <div class="form-container">
    <div class="input-group">
      <textarea id="todo-text" placeholder="例如：明天早上 9 點開會 (可按 Shift+Enter 換行)" rows="2" required></textarea>
    </div>
    <div class="input-group" style="margin-top: 10px;">
      <label for="todo-time" style="font-size: 14px; font-weight: bold; color: #555;">提醒時間 (選填):</label>
      <input type="time" id="todo-time">
      <label for="todo-snooze" style="font-size: 14px; font-weight: bold; color: #555; margin-left: 10px;">貪睡間隔:</label>
      <input type="number" id="todo-snooze" value="5" min="1" max="60" style="width: 50px; padding: 5px; border: 1px solid #ccc; border-radius: 5px;">
      <span style="font-size: 12px; color: #777;">分</span>
      <button id="add-todo-btn" style="flex: 1; margin-left: 10px;">➕ 新增</button>
    </div>
  </div>

  <div id="todo-list">
    <!-- Todos will be generated here -->
  </div>

  <script src="todo.js"></script>
</body>
</html>
