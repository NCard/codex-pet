<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AI PET</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pet-container" id="pet">
    <div class="chat-bubble" id="chat-bubble" style="display: none;">
      <span id="chat-close" style="position: absolute; right: 8px; top: 4px; cursor: pointer; color: #6bb2d5; font-weight: bold; font-size: 14px;">✕</span>
      <div id="chat-content">Hello! 我是你的奇異鳥小助手！</div>
    </div>
    <!-- 聊天輸入框 -->
    <input type="text" id="chat-input" placeholder="跟 Wiki Wiki 對話..." style="display: none;">
    <!-- 自訂右鍵選單 -->
    <div id="custom-menu" style="display: none;">
      <div class="menu-item" id="menu-history">📜 歷史對話 (History)</div>
      <div class="menu-item" id="menu-sleep">💤 睡覺 (Sleep)</div>
      <div class="menu-item" id="menu-close">❌ 關閉 (Exit)</div>
    </div>
    <img src="../assets/images/kiwi.png" alt="kiwi pet" id="kiwi-img">
  </div>
  <script src="renderer.js"></script>
</body>
</html>
