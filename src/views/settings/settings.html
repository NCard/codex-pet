<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wiki Wiki 設定中心</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="header">⚙️ 設定中心</div>
  
  <div class="section">
    <div class="section-title">🛌 床鋪自訂 (Bed)</div>
    
    <div class="control-group">
      <label>X 軸偏移 <span id="val-bed-x">0px</span></label>
      <input type="range" id="bed-x" min="-100" max="100" value="0">
    </div>
    
    <div class="control-group">
      <label>Y 軸偏移 <span id="val-bed-y">0px</span></label>
      <input type="range" id="bed-y" min="-100" max="100" value="0">
    </div>
    
    <div class="control-group">
      <label>床鋪大小 <span id="val-bed-scale">170px</span></label>
      <input type="range" id="bed-scale" min="100" max="300" value="170">
    </div>

    <div class="control-group">
      <label>圖層位置</label>
      <select id="bed-z">
        <option value="-1">小鳥下方 (背景)</option>
        <option value="15">小鳥上方 (前景)</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">⚡ 動畫速度 (Animation)</div>
    
    <div class="control-group">
      <label>呼吸速度倍率 <span id="val-anim-speed">1.0x</span></label>
      <input type="range" id="anim-speed" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>
  </div>
  
  <div class="section">
    <div class="section-title">🔗 API 設定 (API Key)</div>
    
    <div class="control-group">
      <label>Gemini API Key</label>
      <div style="display: flex; gap: 10px; margin-top: 5px;">
        <input type="password" id="setting-apiKey" placeholder="請填寫您的金鑰..." style="flex: 1; box-sizing: border-box; padding: 5px; border-radius: 5px; border: 1px solid #ccc; font-family: 'Microsoft JhengHei', sans-serif;">
        <button id="btn-save-key" style="padding: 5px 15px; border-radius: 5px; border: none; background: #4CAF50; color: white; cursor: pointer;">儲存確認</button>
      </div>
      <div id="key-save-msg" style="font-size: 11px; color: #4CAF50; margin-top: 5px; display: none;">✅ 已儲存！可直接開始對話</div>
      <div style="font-size: 11px; color: #777; margin-top: 5px;">* 如果您是下載打包版，請務必填寫此欄位才能使用對話與待辦事項功能。</div>
    </div>
  </div>
  
  <div class="section">
    <div class="section-title">🔄 系統更新 (Updates)</div>
    <div class="control-group">
      <button id="btn-check-update" style="padding: 8px 15px; border-radius: 5px; border: none; background: #2196F3; color: white; cursor: pointer; width: 100%; font-weight: bold;">手動檢查更新</button>
      <div id="update-msg" style="font-size: 11px; color: #555; margin-top: 8px; text-align: center; display: none;">正在檢查新版本...</div>
    </div>
  </div>
  
  <button id="btn-reset">還原預設值</button>

  <script src="settings.js"></script>
</body>
</html>
