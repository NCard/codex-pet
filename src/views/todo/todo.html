<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wiki Wiki 待辦事項</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body>
  <div class="header">
    <h1>📋 待辦事項小秘書</h1>
    <p>記下該做的事，還能串聯提醒喔！</p>
  </div>
  
  <div class="form-container">
    <div class="input-group">
      <textarea id="todo-text" placeholder="例如：明天早上 9 點開會 (可按 Shift+Enter 換行)" rows="2" required></textarea>
    </div>
    <div class="input-group" style="margin-top: 10px; align-items: flex-start; flex-direction: column; width: 100%;">
      <label style="font-size: 14px; font-weight: bold; color: #555; cursor: pointer;">
        <input type="checkbox" id="todo-has-alarm"> 加上提醒 (建立鬧鐘)
      </label>
      
      <div id="todo-alarm-settings" style="display: none; flex-direction: column; gap: 8px; width: 100%; background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #eee;">
        <div style="display: flex; gap: 10px;">
          <label><input type="radio" name="todo-alarm-type" value="date" checked> 📅 日期</label>
          <label><input type="radio" name="todo-alarm-type" value="weekly"> 🔁 每週</label>
        </div>
        
        <div style="display: flex; gap: 5px; align-items: center;">
          <input type="date" id="todo-alarm-date" style="padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
          <select id="todo-alarm-hour" style="padding: 5px; border: 1px solid #ccc; border-radius: 4px;"></select>
          <span>:</span>
          <select id="todo-alarm-minute" style="padding: 5px; border: 1px solid #ccc; border-radius: 4px;"></select>
        </div>
        
        <div id="todo-weekly-group" style="display: none;">
          <div class="days-selector" style="display: flex; gap: 5px; justify-content: space-between; margin-top: 5px;">
            <label class="day-chip"><input type="checkbox" value="0"><span>日</span></label>
            <label class="day-chip"><input type="checkbox" value="1"><span>一</span></label>
            <label class="day-chip"><input type="checkbox" value="2"><span>二</span></label>
            <label class="day-chip"><input type="checkbox" value="3"><span>三</span></label>
            <label class="day-chip"><input type="checkbox" value="4"><span>四</span></label>
            <label class="day-chip"><input type="checkbox" value="5"><span>五</span></label>
            <label class="day-chip"><input type="checkbox" value="6"><span>六</span></label>
          </div>
        </div>
        
        <div style="display: flex; align-items: center; gap: 5px;">
          <span style="font-size: 12px; color: #555;">貪睡間隔:</span>
          <input type="number" id="todo-snooze" value="5" min="1" max="60" style="width: 50px; padding: 4px; border: 1px solid #ccc; border-radius: 4px;"> 分鐘
        </div>
      </div>
      
      <button id="add-todo-btn" style="width: 100%; margin-top: 10px; padding: 8px; background: #4caf50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">➕ 新增待辦</button>
    </div>
  </div>

  <div id="todo-list">
    <!-- Todos will be generated here -->
  </div>

  <script src="todo.js"></script>
</body>
</html>
