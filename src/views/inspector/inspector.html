<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Wiki Wiki Agent 檢閱板</title>
  <link rel="stylesheet" href="../common/theme.css">
  <link rel="stylesheet" href="inspector.css">
</head>
<body>
  <div class="inspector-header">
    <div class="header-left">
      <div class="header-title">
        <span class="kiwi-avatar">🐦</span>
        <span>Wiki Wiki Agent 完整檢閱板</span>
      </div>
      <div class="header-meta" id="header-meta">
        <span id="meta-time">剛剛</span> • <span id="meta-chars">0 字元</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-copy-all" class="action-btn primary" title="複製全部回覆內容">
        📋 複製全部
      </button>
      <button id="btn-close" class="action-btn" title="關閉檢閱板 (ESC)">
        ✕ 關閉
      </button>
    </div>
  </div>

  <div class="inspector-body">
    <!-- 推理與思考過程折疊面板 -->
    <div id="inspector-reasoning" class="inspector-reasoning" style="display: none;">
      <details class="reasoning-details" id="reasoning-details" open>
        <summary class="reasoning-summary">
          <div class="summary-left">
            <span class="reasoning-icon">🧠</span>
            <span class="reasoning-title">思考與推理過程</span>
            <span class="reasoning-badge" id="reasoning-level-badge">MEDIUM</span>
            <span id="reasoning-status-pill"></span>
          </div>
          <div class="summary-right">
            <span class="reasoning-meta" id="reasoning-meta">0 輪決策 • 0ms</span>
            <span class="reasoning-arrow">▼</span>
          </div>
        </summary>
        <div class="reasoning-body" id="reasoning-body">
          <!-- 動態渲染各步驟卡片 -->
        </div>
      </details>
    </div>

    <div id="inspector-content" class="inspector-content">
      <!-- 完整渲染後的 Markdown 內容 -->
    </div>
  </div>

  <script src="inspector.js"></script>
</body>
</html>
