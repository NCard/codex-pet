<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      pointer-events: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #overlay-laser-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      background-color: #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 30px #ff3377;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulseLaser 0.8s infinite alternate ease-in-out;
    }
    @keyframes pulseLaser {
      0% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 8px #ff0055, 0 0 16px #ff0055; }
      100% { transform: translate(-50%, -50%) scale(1.25); box-shadow: 0 0 15px #ff0055, 0 0 30px #ff3377; }
    }
  </style>
</head>
<body>
  <div id="overlay-laser-dot"></div>
  <script>
    const { ipcRenderer } = require('electron');
    const dot = document.getElementById('overlay-laser-dot');

    function updatePos() {
      try {
        const pos = ipcRenderer.sendSync('get-cursor-pos');
        if (pos && typeof pos.x === 'number') {
          const relX = pos.x - (window.screenX || 0);
          const relY = pos.y - (window.screenY || 0);

          if (relX >= 0 && relX <= window.innerWidth && relY >= 0 && relY <= window.innerHeight) {
            dot.style.display = 'block';
            dot.style.left = relX + 'px';
            dot.style.top = relY + 'px';
          } else {
            dot.style.display = 'none';
          }
        }
      } catch(e) {}
      requestAnimationFrame(updatePos);
    }
    requestAnimationFrame(updatePos);
  </script>
</body>
</html>
