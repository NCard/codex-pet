<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Wiki Wiki</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pet-container" id="pet">
    <!-- 聊天區塊容器 -->
    <div id="chat-container" style="display: flex; flex-direction: column; gap: 0px; z-index: 20; width: 220px; align-items: center; position: relative;">
      <span id="chat-esc-hint" style="display: none; font-size: 11px; color: white; background: rgba(0, 0, 0, 0.3); padding: 3px 10px; border-radius: 12px; pointer-events: none; margin-bottom: 8px; letter-spacing: 0.5px; backdrop-filter: blur(2px);">按 ESC 退出對話</span>
      <div class="chat-bubble" id="chat-bubble" style="display: none; position: relative;">
        <span id="chat-close" style="position: absolute; left: 10px; top: 6px; cursor: pointer; color: #6bb2d5; font-weight: bold; font-size: 14px; z-index: 50;" title="關閉">✖</span>
        <span id="chat-clear" style="position: absolute; right: 10px; bottom: 7px; cursor: pointer; color: #8e8e8e; font-size: 12px; z-index: 50;" title="開啟新話題 (清除上下文)">🧹</span>
        <div id="chat-content">Hello! 我是你的奇異鳥助理！</div>
      </div>
      <textarea id="chat-input" placeholder="對話... (Shift+Enter 換行)" style="display: none;"></textarea>
    </div>
    <!-- 自訂右鍵選單 -->
    <div id="custom-menu" style="display: none;">
      <div class="menu-group-title">— 效率工具 —</div>
      <div class="menu-item" id="menu-todo">📋 待辦事項</div>
      <div class="menu-item" id="menu-alarm">⏰ 鬧鐘排程</div>
      <div class="menu-item" id="menu-history">📜 歷史對話</div>
      
      <div class="menu-separator"></div>
      <div class="menu-group-title">— 互動玩耍 —</div>
      <div class="menu-item" id="menu-feed">🍎 餵食</div>
      <div class="menu-item" id="menu-pet">✋ 摸摸</div>
      <div class="menu-item" id="menu-sleep">💤 睡覺</div>
      <div class="menu-item" id="menu-laser">🔴 開啟雷射筆</div>
      
      <div class="menu-separator"></div>
      <div class="menu-group-title">— 系統設定 —</div>
      <div class="menu-item" id="menu-outfit">🎩 換裝衣櫥</div>
      <div class="menu-item" id="menu-settings">⚙️ 設定</div>
      
      <div class="menu-separator"></div>
      <div class="menu-footer-row">
        <div class="menu-item menu-footer-btn" id="menu-cancel">取消</div>
        <div class="menu-item menu-footer-btn danger" id="menu-close">結束</div>
      </div>
    </div>
    <div id="laser-dot" style="display: none; position: fixed; width: 16px; height: 16px; border-radius: 50%; background: #ff1744; box-shadow: 0 0 12px #ff1744, 0 0 24px #ff5252; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); animation: laserPulse 0.6s infinite alternate;"></div>
    <div id="kiwi-wrapper" style="position: relative; display: inline-block;">
      <div id="kiwi-zzz" style="display: none; position: absolute; top: -15px; right: -20px; font-size: 24px; font-weight: bold; color: #78909c; font-family: 'Comic Sans MS', cursive, sans-serif; pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px white; animation: floatZzz 2s infinite ease-in-out;">Zzz...</div>
      
      <div id="kiwi-sprite-wrapper" style="position: relative; display: flex; justify-content: center; align-items: center;">
        <div id="kiwi-accessory" style="display: none; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 40px; pointer-events: none; animation: breathe 3s infinite ease-in-out;">⏳</div>
        <div id="kiwi-heart" style="display: none; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 24px; pointer-events: none; z-index: 10; text-shadow: 0 0 5px red;">❤️</div>
        <div id="kiwi-character" style="position: relative; display: inline-block;">
          <div id="outfit-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"></div>
          <img src="../../../assets/images/kiwi.png" alt="kiwi pet" id="kiwi-img">
        </div>
        <div id="kiwi-food" style="display: none; position: absolute; bottom: -2px; right: -25px; font-size: 32px; z-index: 5; pointer-events: none;">🥝</div>
      </div>
      
      <img src="../../../assets/images/bed.png" id="kiwi-bed" style="display: none; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); margin-left: var(--bed-x, -4px); margin-bottom: var(--bed-y, -15px); width: var(--bed-scale, 170px); z-index: var(--bed-z, -1); pointer-events: none;">
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
