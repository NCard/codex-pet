<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Wiki Wiki</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pet-container" id="pet">
    <!-- 聊天區塊容器 -->
    <div id="chat-container">
      <!-- 智慧剪貼簿主動感知 Badge -->
      <div id="clipboard-badge" class="clipboard-badge" style="display: none;">
        <span id="clipboard-badge-icon" class="badge-icon">💡</span>
        <span id="clipboard-badge-text" class="badge-text">發現報錯！點我看解析</span>
        <span id="clipboard-badge-close" class="badge-close" title="忽略">✕</span>
      </div>
      <!-- 💭 Wiki Wiki 獨立迷你自言自語泡泡（不搶焦點、點擊可接話） -->
      <div id="monologue-bubble" class="monologue-bubble" style="display: none;" title="點擊接話聊聊">
        <span class="monologue-icon">💭</span>
        <span id="monologue-text" class="monologue-text"></span>
        <span id="monologue-close" class="monologue-close" title="關閉">✕</span>
      </div>
      <span id="chat-esc-hint" class="chat-esc-hint" style="display: none;">按 ESC 退出對話</span>
      <div class="chat-bubble" id="chat-bubble" style="display: none;">
        <div id="chat-resize-handle" class="chat-resize-handle" title="按住拖曳手動調整對話框寬高">⤢</div>
        <div class="chat-bubble-header" style="padding-left: 16px;">
          <div class="chat-bubble-title">
            <span>🐦</span> <span>Wiki Wiki</span>
          </div>
          <div class="chat-bubble-actions">
            <button id="chat-expand-btn" class="chat-action-btn" title="在新視窗展開完整檢閱 (方便閱讀與複製代碼)">🔍 展開</button>
            <button id="chat-clear" class="chat-action-btn" title="開啟新話題 (清除上下文)">🧹 清除</button>
            <button id="chat-close" class="chat-action-btn danger" title="關閉氣泡">✕</button>
          </div>
        </div>
        <div id="chat-content">Hello! 我是你的奇異鳥助理！</div>
      </div>
      <textarea id="chat-input" placeholder="對話... (Shift+Enter 換行)" style="display: none;"></textarea>
    </div>
    <!-- 自訂右鍵選單 -->
    <div id="custom-menu" style="display: none;">
      <div class="menu-group-title">— 效率工具 —</div>
      <div class="menu-item" id="menu-todo">📋 待辦事項</div>
      <div class="menu-item" id="menu-alarm">⏰ 鬧鐘排程</div>
      <div class="menu-item" id="menu-history">📜 歷史對話</div>
      
      <div class="menu-separator"></div>
      <div class="menu-item has-submenu">
        ✨ 互動玩耍 <span style="float:right; font-size: 10px; margin-top: 2px;">▶</span>
        <div class="submenu">
          <div class="menu-item" id="menu-feed">🍎 餵食</div>
          <div class="menu-item" id="menu-pet">✋ 摸摸</div>
          <div class="menu-item" id="menu-sleep">💤 睡覺</div>
          <div class="menu-item" id="menu-laser">🔴 開啟雷射筆</div>
        </div>
      </div>
      
      <div class="menu-separator"></div>
      <div class="menu-group-title">— 系統設定 —</div>
      <div class="menu-item" id="menu-outfit">🎩 換裝衣櫥</div>
      <div class="menu-item" id="menu-settings">⚙️ 設定</div>
      <div class="menu-item" id="menu-guide">📖 導覽與功能</div>
      
      <div class="menu-separator"></div>
      <div class="menu-footer-row">
        <div class="menu-item menu-footer-btn" id="menu-cancel">取消</div>
        <div class="menu-item menu-footer-btn danger" id="menu-close">結束</div>
      </div>
    </div>
    <div id="laser-dot" style="display: none; position: fixed; width: 16px; height: 16px; border-radius: 50%; background: #ff1744; box-shadow: 0 0 12px #ff1744, 0 0 24px #ff5252; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); animation: laserPulse 0.6s infinite alternate;"></div>
    <div id="kiwi-stage" class="kiwi-stage">
      <div id="kiwi-wrapper" style="position: relative; display: inline-block;">
        <div id="kiwi-zzz" style="display: none; position: absolute; top: -15px; right: -20px; font-size: 24px; font-weight: bold; color: #78909c; font-family: var(--theme-font-main); pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px white; animation: floatZzz 2s infinite ease-in-out;">Zzz...</div>
        
        <div id="kiwi-sprite-wrapper" style="position: relative; display: flex; justify-content: center; align-items: center;">
          <div id="kiwi-accessory" style="display: none; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 40px; pointer-events: none; animation: breathe 3s infinite ease-in-out;">⏳</div>
          <div id="kiwi-heart" style="display: none; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 24px; pointer-events: none; z-index: 10; text-shadow: 0 0 5px red;">❤️</div>
          <div id="kiwi-character" style="position: relative; display: inline-block;">
            <div id="outfit-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;"></div>
            <img src="../../../assets/images/kiwi.png" alt="kiwi pet" id="kiwi-img">
          </div>
          <div id="kiwi-food" style="display: none; position: absolute; bottom: -2px; right: -25px; font-size: 32px; z-index: 5; pointer-events: none;">🥝</div>
        </div>

        <!-- 動態接地陰影：隨站立／跳躍／懸空／睡覺自然縮放 -->
        <div id="kiwi-shadow" class="kiwi-shadow shadow-idle"></div>
        <img src="../../../assets/images/bed.png" id="kiwi-bed" style="display: none; pointer-events: none;">
      </div>

      <!-- 底部 RPG 風格狀態條（HP 飽食 / MP 心情 / CPU 主機負載） -->
      <div id="pet-status-hud" class="pet-status-hud" aria-label="Wiki Wiki 狀態條">
        <div class="hud-bar-row hud-hp" data-bar="hp" title="飽食度 (HP)">
          <span class="hud-label">HP</span>
          <div class="hud-track"><div id="hud-fill-hp" class="hud-fill" style="width: 100%;"></div></div>
          <span id="hud-val-hp" class="hud-val">100</span>
        </div>
        <div class="hud-bar-row hud-mp" data-bar="mp" title="心情值 (MP)">
          <span class="hud-label">MP</span>
          <div class="hud-track"><div id="hud-fill-mp" class="hud-fill" style="width: 100%;"></div></div>
          <span id="hud-val-mp" class="hud-val">100</span>
        </div>
        <div class="hud-bar-row hud-cpu" data-bar="cpu" title="主機 CPU 負載">
          <span class="hud-label">CPU</span>
          <div class="hud-track"><div id="hud-fill-cpu" class="hud-fill" style="width: 0%;"></div></div>
          <span id="hud-val-cpu" class="hud-val">0%</span>
        </div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
